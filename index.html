<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texas Government & USDA FSA Vacant Land Portal</title>
  
  <!-- PWA Web App Manifest (Embedded Data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"TX Land Finder","short_name":"TXLand","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/854/854878.png","sizes":"512x512","type":"image/png"}]}' />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .modal-backdrop { background-color: rgba(0, 0, 0, 0.7); }
    .tab-active { border-bottom: 2px solid #f59e0b; color: #f59e0b; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-map-location-dot text-amber-500 text-2xl"></i>
        <div>
          <h1 class="text-lg md:text-xl font-bold tracking-tight">TX Govt & USDA Land Portal</h1>
          <p class="text-[10px] md:text-xs text-slate-400">Zero Structures | Struck-Off | FSA Inventory | GLO Surplus</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleModal('infoModal')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded transition text-slate-200">
          <i class="fa-solid fa-book-open mr-1"></i> Guide
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Sidebar Filters -->
    <aside class="lg:col-span-1 bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h2 class="font-bold text-base text-slate-100"><i class="fa-solid fa-filter text-amber-400 mr-2"></i>Filter Parcels</h2>
        <button onclick="resetFilters()" class="text-xs text-amber-400 hover:underline">Reset All</button>
      </div>

      <!-- Keyword Search -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Search Keywords / Parcel ID</label>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="e.g. R-881203, creek, road..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
      </div>

      <!-- 254 Texas Counties Dropdown -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Select Texas County (254 Counties)</label>
        <select id="countySelectFilter" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <option value="ALL">All Texas Counties (254)</option>
          <option value="Anderson County">Anderson County</option>
          <option value="Andrews County">Andrews County</option>
          <option value="Angelina County">Angelina County</option>
          <option value="Aransas County">Aransas County</option>
